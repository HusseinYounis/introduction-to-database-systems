<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Introduction-to-Database-Systems</title>
<style>
  :root { --accent:#2f5496; --border:#e2e8f0; --muted:#64748b; }
  * { box-sizing:border-box; }
  body { font-family:"Segoe UI",system-ui,Arial,sans-serif; margin:0; background:#f8fafc; color:#0f172a; }
  .wrap { max-width:820px; margin:0 auto; padding:56px 24px; }
  h1 { font-size:28px; margin:0 0 6px; }
  .sub { color:var(--muted); margin:0 0 32px; }
  .grid { display:grid; gap:12px; grid-template-columns:1fr; }
  @media (min-width:640px){ .grid { grid-template-columns:1fr 1fr; } }
  .card { display:flex; flex-direction:column; gap:6px; padding:18px 20px; border:1px solid var(--border);
          border-radius:14px; background:#fff; text-decoration:none; color:inherit; transition:.15s; }
  .card:hover { border-color:var(--accent); box-shadow:0 6px 20px rgba(47,84,150,.12); transform:translateY(-1px); }
  .tag { font-size:11px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--accent); }
  .name { font-size:16px; font-weight:600; }
  .empty { color:var(--muted); }
</style>
</head>
<body>
  <div class="wrap">
    <h1>Introduction-to-Database-Systems</h1>
    <p class="sub">Published course materials</p>
    <div class="grid">
      <a class="card" href="./book/"><span class="tag">Full book</span><span class="name">Open the whole book (6 pages)</span></a>
      
    </div>
    
  </div>
</body>
</html>
